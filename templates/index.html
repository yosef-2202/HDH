{% extends "base.html" %}
{% block title %}Tổng quan - Hệ Thống AI{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h3 class="fw-bold mb-1 text-dark fs-4 fs-md-3">Bảng điều khiển</h3>
        <p class="text-muted small mb-0">Giám sát tài nguyên máy chủ</p>
    </div>
    <span class="badge bg-success-subtle text-success border border-success px-3 py-2 rounded-pill shadow-sm d-flex align-items-center">
        <span class="spinner-grow spinner-grow-sm me-2 text-success" role="status" aria-hidden="true" style="width: 0.8rem; height: 0.8rem;"></span> <span class="d-none d-sm-inline">Server hoạt động</span>
    </span>
</div>

<!-- STATS CARDS REALTIME (CPU & RAM) -->
<div class="row mb-5 g-4">
    <!-- CPU Usage -->
    <div class="col-12 col-md-6">
        <div class="card custom-card h-100 border-0 shadow-sm" style="border-radius: 1rem;">
            <div class="card-body p-4">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <div class="d-flex align-items-center gap-3">
                        <div class="bg-primary-subtle p-3 rounded-4 text-primary">
                            <i class="fa-solid fa-microchip fs-3"></i>
                        </div>
                        <h6 class="fw-bold mb-0 text-secondary text-uppercase fs-6">Tải CPU (Usage)</h6>
                    </div>
                    <h3 class="fw-bold text-primary mb-0"><span id="stat-cpu-text">0</span>%</h3>
                </div>
                <div class="progress mt-4" style="height: 12px; border-radius: 10px; background-color: #f1f5f9;">
                    <div id="stat-cpu-bar" class="progress-bar bg-primary progress-bar-striped progress-bar-animated" role="progressbar" style="width: 0%; transition: width 0.5s ease, background-color 0.3s ease;"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- RAM Usage -->
    <div class="col-12 col-md-6">
        <div class="card custom-card h-100 border-0 shadow-sm" style="border-radius: 1rem;">
            <div class="card-body p-4">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <div class="d-flex align-items-center gap-3">
                        <div class="bg-success-subtle p-3 rounded-4 text-success">
                            <i class="fa-solid fa-memory fs-3"></i>
                        </div>
                        <h6 class="fw-bold mb-0 text-secondary text-uppercase fs-6">Bộ nhớ (RAM)</h6>
                    </div>
                    <h3 class="fw-bold text-success mb-0"><span id="stat-ram-text">0</span>%</h3>
                </div>
                <div class="progress mt-4" style="height: 12px; border-radius: 10px; background-color: #f1f5f9;">
                    <div id="stat-ram-bar" class="progress-bar bg-success progress-bar-striped progress-bar-animated" role="progressbar" style="width: 0%; transition: width 0.5s ease, background-color 0.3s ease;"></div>
                </div>
                <div class="mt-3 text-end text-muted small fw-bold">
                    Đang dùng: <span id="stat-ram-used">0</span> GB / Tổng: <span id="stat-ram-total">0</span> GB
                </div>
            </div>
        </div>
    </div>
</div>

<!-- THÀNH VIÊN ĐỘNG -->
<h5 class="fw-bold text-dark mb-4 border-bottom pb-3"><i class="fa-solid fa-users text-primary me-2"></i>Thành viên phát triển</h5>
<div id="members-container" class="row row-cols-2 row-cols-sm-3 row-cols-md-3 row-cols-lg-5 g-3 mb-4">
    <!-- Thẻ thành viên sẽ được nạp tự động bằng JS ở đây -->
</div>

<script>
    // Hàm gọi API lấy thông số phần cứng
    function fetchSystemStats() {
        fetch('/api/stats')
            .then(res => res.json())
            .then(data => {
                let cpu = parseFloat(data.cpu_percent) || 0;
                let ram = parseFloat(data.ram_percent) || 0;
                
                // Cập nhật giao diện CPU
                document.getElementById('stat-cpu-text').innerText = cpu.toFixed(1);
                let cpuBar = document.getElementById('stat-cpu-bar');
                cpuBar.style.width = cpu + '%';
                cpuBar.className = `progress-bar progress-bar-striped progress-bar-animated ${cpu >= 85 ? 'bg-danger' : (cpu >= 60 ? 'bg-warning' : 'bg-primary')}`;
                document.getElementById('stat-cpu-text').parentElement.className = `fw-bold mb-0 ${cpu >= 85 ? 'text-danger' : (cpu >= 60 ? 'text-warning' : 'text-primary')}`;

                // Cập nhật giao diện RAM
                document.getElementById('stat-ram-text').innerText = ram.toFixed(1);
                let ramBar = document.getElementById('stat-ram-bar');
                ramBar.style.width = ram + '%';
                ramBar.className = `progress-bar progress-bar-striped progress-bar-animated ${ram >= 85 ? 'bg-danger' : (ram >= 60 ? 'bg-warning' : 'bg-success')}`;
                document.getElementById('stat-ram-text').parentElement.className = `fw-bold mb-0 ${ram >= 85 ? 'text-danger' : (ram >= 60 ? 'text-warning' : 'text-success')}`;

                document.getElementById('stat-ram-used').innerText = data.ram_used;
                document.getElementById('stat-ram-total').innerText = data.ram_total;
            })
            .catch(err => console.error("Lỗi lấy dữ liệu:", err));
    }
    
    // Khởi chạy ngay và lặp lại sau mỗi 2 giây
    fetchSystemStats();
    setInterval(fetchSystemStats, 2000);

    // Render danh sách thành viên với tính năng khôi phục mặc định nếu bị trống
    const bgColors = ["3182ce", "38a169", "d69e2e", "e53e3e", "805ad5"];
    
    fetch('/api/members')
        .then(res => res.json())
        .then(data => {
            let memberList = [];
            if (data.success && data.members) {
                memberList = data.members;
            }

            // TỰ ĐỘNG KHÔI PHỤC 5 THÀNH VIÊN NẾU DATABASE BỊ RỖNG
            if (memberList.length === 0) {
                memberList = [
                    {name: "Đỗ Cao Thúy Vi", id: "49.01.103.093", role: "Nhóm Trưởng", avatar: ""},
                    {name: "Đoàn Thị Thanh Diễm", id: "50.01.103.012", role: "", avatar: ""},
                    {name: "Nguyễn Thái Dương", id: "49.01.104.024", role: "", avatar: ""},
                    {name: "Nguyễn Trung Luật", id: "49.01.104.086", role: "", avatar: ""},
                    {name: "Bùi Vạn Thiên", id: "51.01.103.084", role: "", avatar: ""}
                ];
                
                // Lưu ngược 5 thành viên này vào Database để sửa lỗi
                fetch('/api/members', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ members: memberList })
                });
            }

            // Hiển thị danh sách ra màn hình
            const container = document.getElementById('members-container');
            container.innerHTML = '';
            memberList.forEach((member, index) => {
                let roleBadge = member.role ? `<span class="badge bg-danger-subtle text-danger border border-danger px-2 py-1 rounded-pill mt-1" style="font-size: 0.7rem;">${member.role}</span>` : '';
                let avatarUrl = member.avatar || `https://ui-avatars.com/api/?name=${encodeURIComponent(member.name)}&background=${bgColors[index % bgColors.length]}&color=fff&size=70`;
                
                container.innerHTML += `
                    <div class="col">
                        <div class="card custom-card text-center py-4 h-100 border-0 shadow-sm rounded-4">
                            <div class="card-body px-2">
                                <img src="${avatarUrl}" class="rounded-circle mb-3 shadow" style="width:70px; height:70px; object-fit:cover;">
                                <h6 class="fw-bold mb-1 fs-6">${member.name}</h6>
                                <p class="text-muted small mb-0">${member.id}</p>
                                ${roleBadge}
                            </div>
                        </div>
                    </div>
                `;
            });
        });
</script>
{% endblock %}
