{% extends 'base.html' %}
{% block content %}
<h2>Chatbot AI Hỗ trợ</h2><br>
<div class="card" style="max-width: 600px; display: flex; flex-direction: column; height: 600px;">
    <div class="card-header">Trò chuyện với Trợ lý</div>
    <div id="chatWindow" style="flex: 1; overflow-y: auto; padding: 10px; background: #f9f9f9; border: 1px solid #ddd; margin-bottom: 15px; border-radius: 4px;">
        <div style="margin-bottom: 10px; color: #104c7d;"><strong>Bot:</strong> Xin chào! Tôi có thể giúp gì cho bạn? (Mô hình LLM chưa được cài đặt)</div>
    </div>
    <div style="display: flex; gap: 10px;">
        <input type="text" id="chatInput" class="form-control" style="margin-bottom: 0;" placeholder="Nhập câu hỏi...">
        <button onclick="sendMessage()" class="btn btn-primary">Gửi</button>
    </div>
</div>
<script>
    function sendMessage() {
        const input = document.getElementById('chatInput');
        const chatWindow = document.getElementById('chatWindow');
        if (!input.value) return;
        
        chatWindow.innerHTML += `<div style="margin-bottom: 10px; text-align: right;"><strong>Bạn:</strong> ${input.value}</div>`;
        
        fetch('/api/chat', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({message: input.value})
        }).then(res => res.json()).then(data => {
            chatWindow.innerHTML += `<div style="margin-bottom: 10px; color: #104c7d;"><strong>Bot:</strong> ${data.response}</div>`;
            chatWindow.scrollTop = chatWindow.scrollHeight;
        });
        input.value = '';
    }
</script>
{% endblock %}
