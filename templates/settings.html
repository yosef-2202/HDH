{% extends "base.html" %}
{% block title %}Cài đặt hệ thống - Hệ Thống AI{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h3 class="fw-bold mb-0 text-dark">Cài đặt hệ thống</h3>
</div>

<div class="row">
    <div class="col-lg-8">
        <div class="card custom-card p-4">
            <form id="configForm">
                <h5 class="fw-bold mb-4 border-bottom pb-2">Cấu hình API & Hiệu suất</h5>
                <div class="mb-4">
                    <label class="form-label fw-bold text-muted small text-uppercase">Gemini API Key 1</label>
                    <input type="text" class="form-control" id="token1" placeholder="Nhập mã token thứ nhất...">
                </div>
                <div class="mb-4">
                    <label class="form-label fw-bold text-muted small text-uppercase">Gemini API Key 2</label>
                    <input type="text" class="form-control" id="token2" placeholder="Nhập mã token thứ hai...">
                </div>

                <div class="mb-4 bg-light p-3 rounded border">
                    <label class="form-label fw-bold d-block text-dark">Số lượng Job xử lý đồng thời (Đơn/Đa luồng)</label>
                    <small class="text-muted d-block mb-2">Nhập 1 để chạy Đơn luồng. Nhập >1 để chạy Đa luồng (Khuyến nghị: 2 - 4).</small>
                    <input type="number" class="form-control" id="concurrentJobs" min="1" max="10" style="width: 150px;" value="2">
                </div>

                <h5 class="fw-bold mb-4 border-bottom pb-2 mt-5">Quản lý 5 Tính năng (Bật/Tắt)</h5>
                <div class="row mb-4">
                    <div class="col-md-6 mb-3">
                        <div class="form-check form-switch d-flex align-items-center gap-2">
                            <input class="form-check-input fs-5 m-0" type="checkbox" role="switch" id="enableVideo">
                            <label class="form-check-label fw-bold" for="enableVideo">Xử lý Video (Tải file)</label>
                        </div>
                    </div>
                    <div class="col-md-6 mb-3">
                        <div class="form-check form-switch d-flex align-items-center gap-2">
                            <input class="form-check-input fs-5 m-0" type="checkbox" role="switch" id="enableRtsp">
                            <label class="form-check-label fw-bold" for="enableRtsp">Xử lý Luồng RTSP</label>
                        </div>
                    </div>
                    <div class="col-md-6 mb-3">
                        <div class="form-check form-switch d-flex align-items-center gap-2">
                            <input class="form-check-input fs-5 m-0" type="checkbox" role="switch" id="enableChatbot">
                            <label class="form-check-label fw-bold" for="enableChatbot">Chatbot AI (Upload)</label>
                        </div>
                    </div>
                    <div class="col-md-6 mb-3">
                        <div class="form-check form-switch d-flex align-items-center gap-2">
                            <input class="form-check-input fs-5 m-0" type="checkbox" role="switch" id="enableImage">
                            <label class="form-check-label fw-bold" for="enableImage">Xử lý Ảnh</label>
                        </div>
                    </div>
                    <div class="col-md-6 mb-3">
                        <div class="form-check form-switch d-flex align-items-center gap-2">
                            <input class="form-check-input fs-5 m-0" type="checkbox" role="switch" id="enableRealtime">
                            <label class="form-check-label fw-bold" for="enableRealtime">Phân tích Realtime</label>
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary px-4 fw-bold"><i class="fa-solid fa-floppy-disk me-2"></i>Lưu cấu hình</button>
            </form>
        </div>
    </div>
</div>

<script>
    fetch('/api/config')
        .then(res => res.json())
        .then(data => {
            document.getElementById('token1').value = data.gemini_tokens[0];
            document.getElementById('token2').value = data.gemini_tokens[1];
            document.getElementById('concurrentJobs').value = data.concurrent_jobs;
            
            document.getElementById('enableVideo').checked = data.enable_video;
            document.getElementById('enableRtsp').checked = data.enable_rtsp;
            document.getElementById('enableChatbot').checked = data.enable_chatbot;
            document.getElementById('enableImage').checked = data.enable_image;
            document.getElementById('enableRealtime').checked = data.enable_realtime;
        });

    document.getElementById('configForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const payload = {
            token1: document.getElementById('token1').value,
            token2: document.getElementById('token2').value,
            concurrent_jobs: document.getElementById('concurrentJobs').value,
            enable_video: document.getElementById('enableVideo').checked,
            enable_rtsp: document.getElementById('enableRtsp').checked,
            enable_chatbot: document.getElementById('enableChatbot').checked,
            enable_image: document.getElementById('enableImage').checked,
            enable_realtime: document.getElementById('enableRealtime').checked
        };

        fetch('/api/config', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
        .then(res => res.json())
        .then(data => {
            if(data.success) {
                alert('Đã lưu cấu hình thành công!');
                window.location.reload();
            }
        });
    });
</script>
{% endblock %}
