{% extends 'base.html' %}

{% block title %}Phân tích Ảnh Tĩnh - AI PLATFORM{% endblock %}

{% block content %}
<style>
    .image-card-container {
        max-width: 800px;
    }
    .image-input-file {
        border: 1px dashed #cbd5e1;
    }
    .image-preview-panel {
        min-height: 280px;
        background-color: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
    }
</style>

<div class="mb-4">
    <h3 class="fw-bold text-dark mb-1">
        <i class="fa-solid fa-image text-primary me-2"></i>Phân tích Ảnh Tĩnh
    </h3>
    <p class="text-muted small mb-0">Tải lên hình ảnh để phát hiện đối tượng, nhận diện tư thế hoặc hành vi</p>
</div>

<div class="card shadow-sm border-0 image-card-container">
    <div class="card-header bg-white py-3 border-bottom">
        <h5 class="mb-0 fw-semibold text-secondary">
            <i class="fa-solid fa-cloud-arrow-up text-primary me-2"></i>Tải ảnh lên
        </h5>
    </div>
    <div class="card-body p-4">
        <form action="/api/upload_image" method="POST" enctype="multipart/form-data">
            <div class="mb-3">
                <label for="image-upload-input" class="form-label fw-semibold text-dark">Chọn tệp hình ảnh:</label>
                <input 
                    type="file" 
                    id="image-upload-input" 
                    name="file" 
                    accept="image/*" 
                    class="form-control image-input-file" 
                    title="Chọn tệp hình ảnh để tải lên" 
                    placeholder="Chọn tệp hình ảnh"
                    aria-label="Chọn tệp hình ảnh để tải lên"
                >
            </div>
            <button type="submit" class="btn btn-primary px-4 py-2 fw-medium" title="Bắt đầu phân tích hình ảnh">
                <i class="fa-solid fa-magnifying-glass me-1"></i> Phân tích
            </button>
        </form>

        <div class="row g-3 mt-3">
            <div class="col-md-6">
                <div class="image-preview-panel d-flex flex-column justify-content-center align-items-center text-secondary p-3">
                    <i class="fa-regular fa-image fs-1 mb-2 text-muted"></i>
                    <span class="fw-medium">Ảnh gốc</span>
                </div>
            </div>
            <div class="col-md-6">
                <div class="image-preview-panel d-flex flex-column justify-content-center align-items-center text-secondary p-3">
                    <i class="fa-solid fa-wand-magic-sparkles fs-1 mb-2 text-muted"></i>
                    <span class="fw-medium">Ảnh kết quả</span>
                    <small class="text-muted">(Mô hình chưa được cài đặt)</small>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
