{% extends 'base.html' %}
{% block content %}
<h2>Phân tích Ảnh Tĩnh</h2><br>
<div class="card" style="max-width: 800px;">
    <div class="card-header">Tải ảnh lên</div>
    <form action="/api/upload_image" method="POST" enctype="multipart/form-data">
        <input type="file" name="file" accept="image/*" class="form-control" style="border: 1px dashed #ccc;">
        <button type="submit" class="btn btn-primary">Phân tích</button>
    </form>
    <div style="display: flex; gap: 20px; margin-top: 20px;">
        <div style="flex: 1; height: 300px; background: #eee; display: flex; justify-content: center; align-items: center; border: 1px solid #ccc;">
            Ảnh gốc
        </div>
        <div style="flex: 1; height: 300px; background: #eee; display: flex; justify-content: center; align-items: center; border: 1px solid #ccc;">
            Ảnh kết quả (Mô hình chưa được cài đặt)
        </div>
    </div>
</div>
{% endblock %}
